name: Validar catálogo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ler repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r requirements-dev.txt
      - name: Conferir arquivos gerados
        run: python scripts/generate_catalog.py --check
      - name: Validar plugins e skills
        run: python scripts/validate_catalog.py
      - name: Conferir links locais
        run: python scripts/check_links.py
      - name: Testar utilitários
        run: python -m unittest discover -s tests -v
      - name: Conferir espaços e conflitos no diff
        run: git diff --check
