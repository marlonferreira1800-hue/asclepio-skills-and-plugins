name: Validar catálogo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ler repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r requirements-dev.txt
      - name: Conferir arquivos gerados
        run: python scripts/generate_catalog.py --check
      - name: Validar plugins e skills
        run: python scripts/validate_catalog.py
      - name: Conferir links locais
        run: python scripts/check_links.py
      - name: Testar utilitários
        run: python -m unittest discover -s tests -v
      - name: Conferir espaços e conflitos no diff
        run: git diff --check
