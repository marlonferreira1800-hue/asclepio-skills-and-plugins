<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisualExplain</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#17223b;font:18px system-ui}main{max-width:1050px;margin:auto;padding:32px}header{color:#6750a4;font-weight:700}h1{font-size:clamp(28px,5vw,48px)}#flow{display:flex;flex-wrap:wrap;gap:18px;margin:32px 0}.step{flex:1 1 180px;border:2px solid #b4a7ed;border-radius:18px;background:white;padding:24px;opacity:.12;transform:translateY(12px);transition:.5s}.step.visible{opacity:1;transform:none}.step b{display:block;color:#7052bf;margin-bottom:12px}button{border:0;border-radius:10px;background:#6750a4;color:white;padding:14px;margin:5px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}small{display:block;margin:22px 0;overflow-wrap:anywhere}#explanation{line-height:1.65}nav{display:flex;flex-wrap:wrap}progress{width:100%}@media(prefers-reduced-motion:reduce){.step{transition:none;transform:none}}@media print{nav,progress{display:none}.step{opacity:1;transform:none}main{padding:0}}
</style><main><header>VisualExplain · aula visual</header><h1 id="title"></h1><p id="position"></p><h2 id="scene"></h2><div id="flow"></div><p id="explanation"></p><small id="source"></small><progress id="progress"></progress><nav aria-label="Controles"><button id="prev">← Anterior</button><button id="step">Revelar etapa</button><button id="play">Reproduzir</button><button id="next">Próxima →</button><button onclick="window.print()">Imprimir cena</button></nav><p>Use ← e → para navegar e espaço para revelar.</p></main><script>
const data=__DATA__;let index=0,revealed=1,timer=null;const $=id=>document.getElementById(id);$('title').textContent=data.title;
function stop(){clearInterval(timer);timer=null;$('play').textContent='Reproduzir'}
function draw(){const s=data.scenes[index];$('scene').textContent=s.title;$('position').textContent=`Cena ${index+1} de ${data.scenes.length}`;$('explanation').textContent=s.explanation;$('source').textContent='Fonte: '+s.source;$('flow').replaceChildren();s.steps.forEach((text,i)=>{const d=document.createElement('div');d.className='step'+(i<revealed?' visible':'');const b=document.createElement('b');b.textContent='Etapa '+(i+1);d.append(b,document.createTextNode(text));$('flow').append(d)});$('prev').disabled=index===0;$('next').disabled=index===data.scenes.length-1;$('step').disabled=revealed>=s.steps.length;$('progress').max=data.scenes.length;$('progress').value=index+1}
function move(delta){stop();index=Math.max(0,Math.min(data.scenes.length-1,index+delta));revealed=1;draw()}
function reveal(){revealed=Math.min(data.scenes[index].steps.length,revealed+1);draw()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('step').onclick=reveal;$('play').onclick=()=>{if(timer){stop();return}if(revealed>=data.scenes[index].steps.length){revealed=1;draw()}$('play').textContent='Pausar';timer=setInterval(()=>{if(revealed<data.scenes[index].steps.length)reveal();else stop()},1800)};
document.addEventListener('keydown',e=>{if(/BUTTON|INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.code==='Space'){e.preventDefault();reveal()}});draw();
</script></html>
